<div id="bill-status-badge" class="d-inline-flex align-items-center gap-2"{% if oob %} hx-swap-oob="outerHTML"{% endif %}>
    <div class="form-check form-switch mb-0 no-print">
        <input class="form-check-input"
               type="checkbox"
               role="switch"
               id="bill-detail-toggle-{{ bill.id }}"
               title="Toggle Paid / Not Paid"
               aria-label="Toggle paid status for Flat {{ bill.flat_name }}"
               {% if bill.is_paid %}
                   checked
                   {% if bill.receipt %}
                       hx-get="{% url 'bill_paid' bill.id 'unpaid' %}?modal=1&source=detail"
                       hx-target="#modal-container"
                       hx-swap="innerHTML"
                   {% else %}
                       hx-post="{% url 'bill_paid' bill.id 'unpaid' %}"
                       hx-target="#bill-status-badge"
                       hx-swap="outerHTML"
                   {% endif %}
               {% else %}
                   hx-get="{% url 'create_receipt' bill.id %}?modal=1&source=detail"
                   hx-target="#modal-container"
                   hx-swap="innerHTML"
               {% endif %}>
    </div>
    {% if bill.is_paid %}
        <span class="badge-paid fs-6">
            <i class="bi bi-check-circle-fill me-1"></i> Paid
        </span>
    {% else %}
        <span class="badge-outstanding fs-6">
            <i class="bi bi-exclamation-circle-fill me-1"></i> Outstanding
        </span>
    {% endif %}
</div>
